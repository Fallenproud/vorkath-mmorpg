name: Deploy to GitHub Pages

# Manual on purpose: enable Pages first (Settings > Pages > Source: GitHub Actions),
# then run this workflow from the Actions tab. To deploy on every push to main instead,
# add "push: { branches: [main] }" under "on:".
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # vite.config.ts uses base './', so the build works from https://<user>.github.io/<repo>/
      - run: pnpm build:static
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
